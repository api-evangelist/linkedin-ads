note: >-
  LinkedIn publishes two first-party API client libraries under the
  github.com/linkedin-developers organization — a TypeScript/JavaScript client
  and a Python client. Both are generic LinkedIn REST clients (Rest.li protocol
  2.0, Linkedin-Version header, 3-legged OAuth) rather than Marketing-specific
  SDKs. CURRENCY FINDING: both stopped at 0.3.0 in 2023 while the Marketing API
  itself ships a new dated version every month (202607 is current) and sunsets
  each version after twelve. No first-party Java, Go, Ruby, PHP, .NET or Rust
  client is published; the Java surface is a sample application, not a library.
