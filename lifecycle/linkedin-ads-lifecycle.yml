  cadence: monthly
  support_window: minimum 12 months per version
  unversioned_calls_allowed: false
  docs: https://learn.microsoft.com/en-us/linkedin/marketing/versioning
  note: >-
    Every versioned call MUST send Linkedin-Version; the latest version is not
    applied by default. A second header, X-Restli-Protocol-Version: 2.0.0,
    selects the Rest.li protocol version and is required on most operations.
deprecation:
  policy_url: https://learn.microsoft.com/en-us/linkedin/shared/breaking-change-policy
  migrations_url: https://learn.microsoft.com/en-us/linkedin/marketing/integrations/migrations
  sunset_header: false
  rfc8594: false
  signal: >-
    HTTP 426 "Version Header is Deprecated" is returned when the version passed
    in the version header has been sunset. LinkedIn does not emit RFC 8594
    Sunset/Deprecation response headers; sunset dates are published as a dated
    table on the migrations page and announced by email to app owners.
  notice_channel: email to Developer Admins, plus the migrations table
  breaking_change_definition:
    breaking:
      - changes to existing permission definitions
      - removal of an allowed parameter, request field or response field
      - addition of a required parameter or request field without a default
      - changes to the intended functionality of an endpoint
      - introduction of a new validation
    non_breaking:
      - addition of new endpoints or methods
      - addition of new response fields or optional request fields
      - addition of a new value returned for an existing text field
      - changes to field order, data length or response size
      - changes to error messages (do not parse them; rely on codes)
  exception: >-
    LinkedIn reserves the right to release a patch version inside the supported
    stable window for critical security, privacy or bug fixes.
