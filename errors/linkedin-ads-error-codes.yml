format: linkedin-service-error
rfc9457: false
summary: LinkedIn publishes a constant error-code registry for the Marketing API alongside the HTTP status
  code and the message template each code renders. The codes are returned in the `code` field of the newer
  machine-readable error envelope, which is currently emitted only by the adAccounts, adCampaignGroups
  and adCampaigns resources; older resources return only message/serviceErrorCode/status. This is an error-code
  registry, not RFC 9457 problem+json — there are no problem `type` URIs and the content type is application/json.
envelope:
  fields:
  - name: message
    type: string
    description: A description of the error.
  - name: serviceErrorCode
    type: int
    description: A subcode that further classifies the error.
  - name: status
    type: int
    description: The HTTP status code.
  - name: code
    type: string
    description: Constant error code defining the category of the error. Its presence means you received
      the new error response.
  - name: errorDetailType
    type: string
    description: Name of the schema for error detail; com.linkedin.common.error.BadRequest is the only
      type released so far.
  - name: errorDetails
    type: object
    description: inputErrors[] and conditionalInputErrors[] carrying the failing inputPath, value, allowed
      bounds/regex and a description.
  coverage: adAccounts, adCampaignGroups, adCampaigns
  legacy_shape: message + serviceErrorCode + status only
http_status_semantics:
- status: 400
  meaning: Bad Request — bad syntax in the request URL or body, or a validation failure.
- status: 401
  meaning: Unauthorized — missing, malformed, invalid, expired or revoked access token.
- status: 403
  meaning: Access Denied — the token lacks permission for the API or the entity.
- status: 404
  meaning: Resource Not Found — wrong path or entity; for Ads it can also mean a restricted API.
- status: 405
  meaning: Method Not Allowed.
- status: 411
  meaning: Length Required — POST with an empty body needs an explicit Content-Length.
- status: 426
  meaning: Version Header is Deprecated — the Linkedin-Version value passed has been sunset.
- status: 429
  meaning: Rate limit reached ("Resource level throttle limit for calls to this resource is reached."),
    or infrastructure protection.
- status: 500
  meaning: Internal Server Error — includes access-token downstream verification failures. Report x-li-uuid,
    x-li-fabric and x-li-request-id to support.
- status: 504
  meaning: Gateway Timeout.
